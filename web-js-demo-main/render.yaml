services:
  - type: web
    name: cr100-scrp-gxpay-checkout
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: MERCHANT_NAME
        value: Demo Merchant
      - key: GXPAY_MODE
        value: mock
      - key: GXPAY_BASE_URL
        value: https://api.gxpay.net
      - key: GXPAY_SIGNING
        value: bearer
      - key: GXPAY_TIMEOUT_MS
        value: 20000
      # Secrets - set actual values in the Render dashboard, not here.
      - key: GXPAY_API_KEY
        sync: false
      - key: GXPAY_API_SECRET
        sync: false
      - key: GXPAY_MERCHANT_ID
        sync: false
      - key: GXPAY_TERMINAL_ID
        sync: false
      - key: GXPAY_WEBHOOK_SECRET
        sync: false
