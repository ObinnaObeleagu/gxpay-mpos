services:
  - type: web
    name: cr100-scrp-gxpay-checkout
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: MERCHANT_NAME
        value: Demo Merchant
      - key: GXPAY_MODE
        value: mock
      - key: GXPAY_BASE_URL
        value: https://api.gxpay.net
      - key: GXPAY_SIGNING
        value: bearer
      - key: GXPAY_TIMEOUT_MS
        value: 20000
      # Secrets - set actual values in the Render dashboard, not here.
      - key: GXPAY_API_KEY
        sync: false
      - key: GXPAY_API_SECRET
        sync: false
      - key: GXPAY_MERCHANT_ID
        sync: false
      - key: GXPAY_TERMINAL_ID
        sync: false
      - key: GXPAY_WEBHOOK_SECRET
        sync: false
      # Database (Supabase) - optional. Leave both unset in the Render
      # dashboard to keep using the zero-setup in-memory store (fine for a
      # demo, gone on every redeploy). Set both to persist transactions and
      # the item catalog in a real Postgres database instead:
      #   1. Create a project at https://supabase.com
      #   2. Run db/schema.sql in that project's SQL Editor (creates the
      #      transactions and catalog_items tables in one migration)
      #   3. Project Settings -> API -> copy the Project URL and the
      #      service_role secret key (NOT the anon/public key)
      #   4. Paste them into the two fields Render prompts for below
      # See README-PAYMENT-INTEGRATION.md, "Database (Supabase)" for the
      # full walkthrough and the security note on why this must be the
      # service_role key.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
